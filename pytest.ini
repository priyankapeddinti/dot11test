[pytest]
testpaths = tests
markers =
    functional: WiFi functionality tests (scan, connect, roam)
    performance: Throughput and latency tests
    stability: Long-running soak and reconnect tests
    soak: Marks tests that may run for many minutes/hours
addopts = -ra --strict-markers --tb=short
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s %(levelname)-7s %(name)s: %(message)s
log_cli_date_format = %H:%M:%S
timeout = 600
